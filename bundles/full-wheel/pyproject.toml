[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrio-llmbench-full"
version = "1.0.1"
description = "QuantTrio llmbench framework with all publicly redistributable data assets"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE", "NOTICE", "packages/llmbench_data_all/licenses/**/*"]
authors = [{ name = "QuantTrio" }]
keywords = ["llm", "benchmark", "evaluation", "quantization", "openai-compatible"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
llmbench = "llmbench.cli:app"

[project.entry-points."llmbench.data_packs"]
all-public = "llmbench_data_all:manifest"

[project.urls]
Homepage = "https://github.com/QuantTrio/llm-eval-bench"
Repository = "https://github.com/QuantTrio/llm-eval-bench"
Issues = "https://github.com/QuantTrio/llm-eval-bench/issues"

[tool.setuptools]
package-dir = { "" = "packages" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["packages"]
include = ["llmbench", "llmbench.*", "llmbench_data_all"]

[tool.setuptools.package-data]
llmbench = ["data/**/*.jsonl", "data/**/*.json", "data/**/*.txt", "schema/*.json"]
llmbench_data_all = ["*.json", "*.jsonl", "licenses/**/*"]
