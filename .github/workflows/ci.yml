name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - if: matrix.python-version == '3.12'
        run: |
          python -m build
          python scripts/verify_package.py dist/*.whl
          python scripts/generate_sbom.py --output dist/sbom.cdx.json dist/*.whl dist/*.tar.gz
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: distributions-and-sbom
          path: dist/
