name: Publish container images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container tag to publish
        required: true
        default: 1.0.1

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: llmbench-executor
            dockerfile: executor/Dockerfile
          - image: llmbench-sandbox
            dockerfile: executor/sandbox.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/quanttrio/${{ matrix.image }}:${{ inputs.image_tag }}
            ghcr.io/quanttrio/${{ matrix.image }}:latest
          sbom: true
          provenance: mode=max
      - name: Export public Docker archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive="/tmp/${{ matrix.image }}-${{ inputs.image_tag }}-linux-amd64.docker.tar"
          docker buildx build \
            --platform linux/amd64 \
            --file "${{ matrix.dockerfile }}" \
            --output "type=docker,name=ghcr.io/quanttrio/${{ matrix.image }}:${{ inputs.image_tag }},dest=$archive" \
            .
          cd /tmp
          sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
          gh release upload "v${{ inputs.image_tag }}" --repo QuantTrio/llm-eval-bench \
            "$archive" "$archive.sha256" --clobber
