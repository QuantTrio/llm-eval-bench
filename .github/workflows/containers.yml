name: Publish container images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container tag to publish
        required: true
        default: 1.0.1

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: llmbench-executor
            dockerfile: executor/Dockerfile
          - image: llmbench-sandbox
            dockerfile: executor/sandbox.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/quanttrio/${{ matrix.image }}:${{ inputs.image_tag }}
            ghcr.io/quanttrio/${{ matrix.image }}:latest
          sbom: true
          provenance: mode=max
      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "orgs/QuantTrio/packages/container/${{ matrix.image }}" \
            -f visibility=public
