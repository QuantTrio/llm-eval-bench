[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "quanttrio-llmbench-data-mteb-retrieval-mini"
version = "0.5.0"
description = "Pinned 500-query MTEB ArguAna retrieval pack for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-SA-4.0"
authors = [{ name = "QuantTrio" }]
[project.entry-points."llmbench.data_packs"]
mteb-retrieval-mini = "llmbench_data_mteb_retrieval_mini:manifest"
[tool.setuptools.package-data]
llmbench_data_mteb_retrieval_mini = ["*.json", "*.jsonl", "NOTICE"]
