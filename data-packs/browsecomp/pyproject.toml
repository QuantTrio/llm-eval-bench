[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrio-llmbench-data-browsecomp"
version = "0.5.0"
description = "Encrypted 100-record BrowseComp regression data pack for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "QuantTrio" }]

[project.entry-points."llmbench.data_packs"]
browsecomp = "llmbench_data_browsecomp:manifest"

[tool.setuptools.package-data]
llmbench_data_browsecomp = ["*.json", "*.jsonl", "NOTICE"]
