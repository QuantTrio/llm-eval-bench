[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrio-llmbench-data-agieval"
version = "0.5.0"
description = "Pinned 200-record AGIEval regression data pack for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "QuantTrio" }]

[project.entry-points."llmbench.data_packs"]
agieval = "llmbench_data_agieval:manifest"

[tool.setuptools.package-data]
llmbench_data_agieval = ["*.json", "*.jsonl", "LICENSE-AGIEVAL"]
