[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "quanttrio-llmbench-data-superglue"
version = "0.5.0"
description = "Local-build 500-record SuperGLUE regression pack for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-SuperGLUE-Mixed"
authors = [{ name = "QuantTrio" }]
[project.entry-points."llmbench.data_packs"]
superglue = "llmbench_data_superglue:manifest"
[tool.setuptools.package-data]
llmbench_data_superglue = ["*.json", "*.jsonl", "NOTICE"]
