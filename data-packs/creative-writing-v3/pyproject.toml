[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "quanttrio-llmbench-data-creative-writing-v3"
version = "0.5.0"
description = "Local-build Creative Writing v3 prompt pack for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Upstream-Unspecified"
authors = [{ name = "QuantTrio" }]
[project.entry-points."llmbench.data_packs"]
creative-writing-v3 = "llmbench_data_creative_writing_v3:manifest"
[tool.setuptools.package-data]
llmbench_data_creative_writing_v3 = ["*.json", "*.jsonl", "NOTICE"]
