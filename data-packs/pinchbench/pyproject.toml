[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "quanttrio-llmbench-data-pinchbench"
version = "0.5.0"
description = "Pinned PinchBench task descriptor pack for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "QuantTrio" }]
[project.entry-points."llmbench.data_packs"]
pinchbench = "llmbench_data_pinchbench:manifest"
[tool.setuptools.package-data]
llmbench_data_pinchbench = ["*.json", "*.jsonl", "NOTICE"]
