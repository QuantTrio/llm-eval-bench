[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "quanttrio-llmbench-data-gdpval-gold"
version = "0.5.0"
description = "Local-build GDPval gold descriptor pack for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-GDPval-Upstream"
authors = [{ name = "QuantTrio" }]
[project.entry-points."llmbench.data_packs"]
gdpval-gold = "llmbench_data_gdpval_gold:manifest"
[tool.setuptools.package-data]
llmbench_data_gdpval_gold = ["*.json", "*.jsonl", "NOTICE"]
