[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrio-llmbench-data-simpleqa"
version = "0.5.0"
description = "Pinned 500-record SimpleQA regression data pack for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "QuantTrio" }]

[project.entry-points."llmbench.data_packs"]
simpleqa = "llmbench_data_simpleqa:manifest"

[tool.setuptools.package-data]
llmbench_data_simpleqa = ["*.json", "*.jsonl", "LICENSE-SIMPLE-EVALS"]
