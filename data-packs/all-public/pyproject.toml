[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrio-llmbench-data-all"
version = "0.5.0"
description = "All publicly redistributable v0.5.0 data assets for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["NOTICE", "llmbench_data_all/licenses/**/*"]
authors = [{ name = "QuantTrio" }]

[project.entry-points."llmbench.data_packs"]
all-public = "llmbench_data_all:manifest"

[tool.setuptools]
packages = ["llmbench_data_all"]
include-package-data = false

[tool.setuptools.package-data]
llmbench_data_all = ["*.json", "*.jsonl", "licenses/**/*"]
