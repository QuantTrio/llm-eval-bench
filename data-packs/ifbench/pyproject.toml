[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrio-llmbench-data-ifbench"
version = "0.5.0"
description = "Pinned 200-record IFBench regression data pack for QuantTrio llmbench"
readme = "README.md"
requires-python = ">=3.10"
license = "ODC-By-1.0"
authors = [{ name = "QuantTrio" }]

[project.entry-points."llmbench.data_packs"]
ifbench = "llmbench_data_ifbench:manifest"

[tool.setuptools.package-data]
llmbench_data_ifbench = ["*.json", "*.jsonl", "NOTICE"]
