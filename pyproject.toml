[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrio-llmbench"
version = "0.1.1"
description = "Offline-ready quality and concurrency benchmarks for OpenAI-compatible LLM APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "QuantTrio" }]
keywords = ["llm", "benchmark", "evaluation", "quantization", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
data = ["pyarrow>=17,<24"]

[project.scripts]
llmbench = "llmbench.cli:app"

[project.urls]
Homepage = "https://github.com/QuantTrio/llm-eval-bench"
Repository = "https://github.com/QuantTrio/llm-eval-bench"
Issues = "https://github.com/QuantTrio/llm-eval-bench/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmbench = ["data/**/*.jsonl", "data/**/*.json", "data/**/*.txt"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_datasets.py" = ["SIM905"]
"src/llmbench/scoring.py" = ["RUF001"]
