[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bench"
version = "2.0.0.dev1"
description = "Independent model evaluation for hosted and local APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT AND CC-BY-4.0 AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "THIRD_PARTY_DATASETS.md", "src/llmbench/data/LICENSES.txt"]
authors = [{ name = "QuantTrio" }]
keywords = ["llm", "benchmark", "evaluation", "responses", "openai-compatible"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
image = ["pillow>=10.4,<13"]
dev = [
  "build>=1.2",
  "fastapi>=0.115,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "uvicorn>=0.30,<1",
  "pillow>=10.4,<13",
]
data = ["pyarrow>=17,<24"]
executor = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
llmbench = "llmbench.cli:app"

[project.urls]
Homepage = "https://github.com/QuantTrio/llm-eval-bench"
Repository = "https://github.com/QuantTrio/llm-eval-bench"
Issues = "https://github.com/QuantTrio/llm-eval-bench/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmbench = ["data/**/*.jsonl", "data/**/*.json", "data/**/*.txt", "data/images/**/*.png", "schema/*.json"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_datasets.py" = ["SIM905"]
"src/llmbench/scoring.py" = ["RUF001"]
